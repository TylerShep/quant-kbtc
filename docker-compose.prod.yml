services:
  bot:
    volumes:
      - kbtc-data:/mnt/data
    environment:
      BOT_ENV: production
      LOG_LEVEL: INFO
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --loop uvloop --workers 1 --no-access-log --timeout-graceful-shutdown 30
    # Phase 1 (Stabilize live exit pipeline): hard cap + reservation.
    # Keep this aligned with BOT_MEM_LIMIT_MB/BOT_MEM_RESERVATION_MB so
    # the in-process RSS watchdog threshold matches the container ceiling.
    mem_limit: 1200m
    mem_reservation: 800m
    cpus: 1.5

  db:
    restart: always
    # Postgres steady-state observed at ~100 MiB; 512m is plenty for our
    # write rate and frees ~256 MiB for the bot.
    mem_limit: 512m
    memswap_limit: 768m
